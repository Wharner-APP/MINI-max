name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT6: "6.5.3"

jobs:
  # ---------------------------------------------------------------- Windows 64-bit
  win64:
    name: minimaxWinX64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.5.3 + Multimedia
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT6 }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310
          modules: qtmultimedia
          cache: true

      - name: Toolchain
        shell: bash
        run: |
          pip install cmake ninja pillow
          echo "$IQTA_TOOLS/mingw1310_64/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER="$IQTA_TOOLS/mingw1310_64/bin/gcc.exe"
          -DCMAKE_CXX_COMPILER="$IQTA_TOOLS/mingw1310_64/bin/g++.exe"
          -DMINIMAX_PLATFORM_ID=minimaxWinX64

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: >
          python tools/package.py
          --build build
          --platform minimaxWinX64
          --out dist
          --qt-bin "$env:QT_ROOT_DIR/bin"
          --mingw-bin "$env:IQTA_TOOLS/mingw1310_64/bin"

      - uses: actions/upload-artifact@v4
        with:
          name: minimaxWinX64
          path: dist/minimaxWinX64.zip

  # ---------------------------------------------------------------- Linux 32-bit / i386
  linux32:
    name: minimaxLinuxX86
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build inside an i386 Debian container
        run: |
          docker run --rm \
            -v "$PWD":/w \
            -w /w \
            i386/debian:bookworm \
            bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                ninja-build \
                git \
                ca-certificates \
                python3 \
                python3-pip \
                patchelf \
                pkg-config \
                qt6-base-dev \
                qt6-multimedia-dev \
                libqt6svg6-dev \
                libgl1-mesa-dev \
                libxkbcommon-x11-0 \
                libxcb-cursor0 \
                libxcb-icccm4 \
                libxcb-image0 \
                libxcb-keysyms1 \
                libxcb-render-util0 \
                libxcb-shape0 \
                libxcb-xkb1 \
                libxcb-xinerama0 \
                libxcb-randr0 \
                libxcb-sync1

              cmake -S . -B build32 -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DMINIMAX_PLATFORM_ID=minimaxLinuxX86

              cmake --build build32 --parallel

              QT_QPA_PLATFORM=offscreen \
                ctest --test-dir build32 --output-on-failure

              python3 tools/package.py \
                --build build32 \
                --platform minimaxLinuxX86 \
                --out dist
            '

      - uses: actions/upload-artifact@v4
        with:
          name: minimaxLinuxX86
          path: dist/minimaxLinuxX86.tar.gz

  # ---------------------------------------------------------------- macOS 64-bit / Intel
  macos64:
    name: minimaxMacX64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.5.3 + Multimedia
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT6 }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Toolchain
        run: pip install cmake ninja pillow

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DMINIMAX_PLATFORM_ID=minimaxMacX64

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Package
        run: >
          python tools/package.py
          --build build
          --platform minimaxMacX64
          --out dist
          --qt-bin "$QT_ROOT_DIR/bin"

      - uses: actions/upload-artifact@v4
        with:
          name: minimaxMacX64
          path: dist/minimaxMacX64.tar.gz

  # ---------------------------------------------------------------- GitHub Release with only the 3 supported archives
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [win64, linux32, macos64]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Safety check - captcha config must not be inside any archive
        shell: bash
        run: |
          set -e
          shopt -s nullglob

          for f in out/*.zip; do
            if unzip -l "$f" | grep -i "captchaapi"; then
              echo "CaptchaAPI.cfg found in $f"
              exit 1
            fi
          done

          for f in out/*.tar.gz; do
            if tar tzf "$f" | grep -i "captchaapi"; then
              echo "CaptchaAPI.cfg found in $f"
              exit 1
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*

  # ---------------------------------------------------------------- Full source archive
  source:
    name: MINI-max-source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create source archive
        shell: bash
        run: |
          set -e
          rm -rf source-archive
          mkdir -p source-archive
          cp -a . source-archive/MINI-max
          rm -rf source-archive/MINI-max/.git
          rm -rf source-archive/MINI-max/.github/workflows
          zip -qr MINI-max-client-source.zip source-archive/MINI-max
      - uses: actions/upload-artifact@v4
        with:
          name: MINI-max-client-source
          path: MINI-max-client-source.zip
